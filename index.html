<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Токио-шопинг</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Токио-шопинг <span class="badge">пилот</span></h1>
    <p class="sub" id="summary">Загрузка…</p>
  </header>

  <section>
    <h2>Карта магазинов</h2>
    <div class="legend" id="legend"></div>
    <div id="map"></div>
    <p class="note" id="mapNote"></p>
  </section>

  <section>
    <h2>Бренды</h2>
    <div class="chips" id="brandChips"></div>
    <article class="brand-card" id="brandCard" hidden></article>
  </section>

  <section>
    <h2>Вещи</h2>
    <div class="chips" id="catChips"></div>
    <div class="grid" id="grid"></div>
    <button class="more" id="more" hidden>Показать ещё</button>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="map.js"></script>
</body>
</html>
